<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar lab — Style D</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --ink: #0f172a;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html[data-theme="dark"] {
      --bg: #0b1220;
      --ink: #e7eef8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
    }
    .lab {
      width: min(100% - 2rem, 20rem);
    }
    .lab h1 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 1rem;
      text-align: center;
    }
.avatar {
  display: block;
  flex: 0 0 auto;
  width: 100%;
  margin: 0.5rem 0 0;
  line-height: 0;
}

.avatar__stage {
  position: relative;
  width: min(100%, 15rem);
  margin: 0 auto;
  aspect-ratio: 48 / 56;
}

.avatar__fx {
  position: absolute;
  inset: 6% 4% 28%;
  border-radius: 0.35rem;
  overflow: hidden;
  opacity: 0.5;
  filter: blur(5px);
  pointer-events: none;
  z-index: 0;
}

.avatar__fx-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.avatar__fx-scene {
  opacity: 0;
  transition: opacity 0.5s var(--ease);
}

.avatar__fx-scene.is-active {
  opacity: 1;
}

.avatar__fx-gantt {
  animation: avatar-fx-slide 2.4s ease-in-out infinite alternate;
}

.avatar__fx-scene.is-active .avatar__fx-bar {
  transform-box: fill-box;
  transform-origin: bottom;
  animation: avatar-fx-bar 1.5s var(--ease) both;
}

.avatar__fx-scene.is-active .avatar__fx-bar--2 {
  animation-delay: 0.12s;
}

.avatar__fx-scene.is-active .avatar__fx-bar--3 {
  animation-delay: 0.24s;
}

.avatar__fx-scene.is-active .avatar__fx-bar--4 {
  animation-delay: 0.36s;
}

.avatar__fx-scene.is-active .avatar__fx-curve {
  stroke-dasharray: 180;
  stroke-dashoffset: 180;
  animation: avatar-fx-draw 2s var(--ease) forwards;
}

.avatar__fx-scene.is-active .avatar__fx-card {
  animation: avatar-fx-bob 1.8s ease-in-out infinite alternate;
}

.avatar__svg {
  position: relative;
  z-index: 1;
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.avatar__pupil {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.15s steps(2, end);
}

.avatar__head {
  transform-origin: 24px 14px;
  transform-box: view-box;
}

.avatar.is-nodding .avatar__head {
  animation: avatar-nod 0.85s steps(4, end);
}

.avatar.is-glancing .avatar__head {
  animation: avatar-glance 0.35s steps(2, end) both;
}

.avatar.is-glancing .avatar__pupil {
  filter: drop-shadow(0 0 2px #64ffda);
}

.avatar__antenna {
  animation: avatar-antenna 1.4s steps(2, end) infinite;
}

.avatar__glow {
  opacity: 0.55;
  animation: avatar-glow 1.8s steps(3, end) infinite;
}

.avatar__sticky {
  opacity: 1;
}

.avatar__hand--l {
  animation: avatar-type-l 0.45s steps(2, end) infinite;
}

.avatar__hand--r {
  animation: avatar-type-r 0.38s steps(2, end) infinite;
  animation-delay: 0.12s;
}

.avatar__steam {
  opacity: 0.55;
}

.avatar__steam--1 {
  animation: avatar-steam 1.6s steps(3, end) infinite;
}

.avatar__steam--2 {
  animation: avatar-steam 1.9s steps(3, end) infinite 0.25s;
}

.avatar__steam--3 {
  animation: avatar-steam 1.4s steps(3, end) infinite 0.45s;
}


  </style>
</head>
<body>
  <div class="lab">
    <h1>Avatar lab · Style D</h1>
<figure class="avatar avatar--robot" data-avatar aria-hidden="true">
          <div class="avatar__stage">
            <div class="avatar__fx" data-avatar-fx>
              <svg class="avatar__fx-svg" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
                <g class="avatar__fx-scene is-active" data-fx="0">
                  <rect width="160" height="100" fill="#04101a"/>
                  <rect x="16" y="22" width="128" height="14" rx="2" fill="#0b3d3a"/>
                  <rect x="20" y="26" width="10" height="6" rx="1" fill="#64ffda"/>
                  <line x1="36" y1="29" x2="130" y2="29" stroke="#2dd4bf" stroke-width="2"/>
                  <rect x="16" y="44" width="128" height="14" rx="2" fill="#0b3d3a"/>
                  <rect x="20" y="48" width="10" height="6" rx="1" fill="#64ffda"/>
                  <rect x="16" y="66" width="128" height="14" rx="2" fill="#123"/>
                </g>
                <g class="avatar__fx-scene" data-fx="1">
                  <rect width="160" height="100" fill="#020617"/>
                  <rect x="20" y="28" width="90" height="10" rx="2" fill="#0f766e" class="avatar__fx-gantt"/>
                  <rect x="30" y="48" width="70" height="10" rx="2" fill="#14b8a6"/>
                  <rect x="18" y="68" width="110" height="10" rx="2" fill="#5eead4" class="avatar__fx-gantt"/>
                </g>
                <g class="avatar__fx-scene" data-fx="2">
                  <rect width="160" height="100" fill="#031820"/>
                  <g transform="translate(0 90)">
                    <rect class="avatar__fx-bar" x="28" y="-50" width="16" height="50" fill="#0f766e"/>
                    <rect class="avatar__fx-bar avatar__fx-bar--2" x="56" y="-62" width="16" height="62" fill="#14b8a6"/>
                    <rect class="avatar__fx-bar avatar__fx-bar--3" x="84" y="-40" width="16" height="40" fill="#2dd4bf"/>
                    <rect class="avatar__fx-bar avatar__fx-bar--4" x="112" y="-56" width="16" height="56" fill="#5eead4"/>
                  </g>
                </g>
                <g class="avatar__fx-scene" data-fx="3">
                  <rect width="160" height="100" fill="#020617"/>
                  <path class="avatar__fx-curve" d="M20 78 Q50 78 70 45 T140 28" fill="none" stroke="#64ffda" stroke-width="3"/>
                  <circle cx="70" cy="45" r="4" fill="#fbbf24"/>
                </g>
                <g class="avatar__fx-scene" data-fx="4">
                  <rect width="160" height="100" fill="#04101a"/>
                  <rect x="24" y="20" width="30" height="60" rx="3" fill="#0b3d3a" stroke="#64ffda"/>
                  <rect x="64" y="20" width="30" height="60" rx="3" fill="#123" stroke="#64748b"/>
                  <rect class="avatar__fx-card" x="104" y="20" width="30" height="60" rx="3" fill="#134e4a" stroke="#14b8a6"/>
                </g>
              </svg>
            </div>
            <svg class="avatar__svg" viewBox="0 0 48 56" width="240" height="280" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
              <!-- wall -->
              <rect width="48" height="36" fill="#1a2332"/>
              <rect x="0" y="0" width="2" height="36" fill="#243044"/>
              <rect x="6" y="0" width="2" height="36" fill="#243044"/>
              <rect x="12" y="0" width="2" height="36" fill="#243044"/>
              <rect x="18" y="0" width="2" height="36" fill="#243044"/>
              <rect x="24" y="0" width="2" height="36" fill="#243044"/>
              <rect x="30" y="0" width="2" height="36" fill="#243044"/>
              <rect x="36" y="0" width="2" height="36" fill="#243044"/>
              <rect x="42" y="0" width="2" height="36" fill="#243044"/>
              <!-- desk -->
              <rect y="36" width="48" height="20" fill="#2a3344"/>
              <rect y="36" width="48" height="2" fill="#3d4b63"/>
              <!-- coffee -->
              <g class="avatar__coffee">
                <rect x="38" y="30" width="6" height="6" fill="#e2e8f0"/>
                <rect x="39" y="31" width="4" height="4" fill="#7c4a2d"/>
                <rect class="avatar__steam avatar__steam--1" x="40" y="26" width="1" height="3" fill="#94a3b8"/>
                <rect class="avatar__steam avatar__steam--2" x="42" y="25" width="1" height="4" fill="#94a3b8"/>
              </g>
              <!-- robot body -->
              <rect x="16" y="22" width="16" height="14" fill="#64748b"/>
              <rect x="17" y="23" width="14" height="4" fill="#94a3b8"/>
              <rect x="18" y="28" width="12" height="2" fill="#0f766e"/>
              <rect x="14" y="24" width="3" height="10" fill="#475569"/>
              <rect x="31" y="24" width="3" height="10" fill="#475569"/>
              <!-- robot head -->
              <g class="avatar__head">
                <rect x="17" y="8" width="14" height="14" fill="#94a3b8"/>
                <rect x="18" y="9" width="12" height="12" fill="#cbd5e1"/>
                <!-- antenna -->
                <rect x="23" y="4" width="2" height="4" fill="#64748b"/>
                <rect class="avatar__antenna" x="22" y="2" width="4" height="3" fill="#64ffda"/>
                <!-- visor / eyes -->
                <rect x="19" y="12" width="10" height="5" fill="#0f172a"/>
                <rect class="avatar__pupil" x="20" y="13" width="3" height="3" fill="#64ffda"/>
                <rect class="avatar__pupil" x="26" y="13" width="3" height="3" fill="#64ffda"/>
                <!-- smile plate -->
                <rect x="21" y="18" width="6" height="2" fill="#475569"/>
              </g>
              <!-- laptop lid BACK to viewer -->
              <g class="avatar__laptop">
                <rect x="10" y="26" width="28" height="16" fill="#475569"/>
                <rect x="11" y="27" width="26" height="12" fill="#64748b"/>
                <rect x="20" y="30" width="8" height="5" fill="#334155"/>
                <rect x="9" y="40" width="30" height="3" fill="#334155"/>
                <!-- terminal glow spill under lid edge -->
                <rect class="avatar__glow" x="12" y="38" width="24" height="2" fill="#64ffda"/>
                <g class="avatar__sticky">
                  <rect x="24" y="28" width="11" height="8" fill="#fde047"/>
                  <text class="avatar__sticky-text" x="29.5" y="33.5" text-anchor="middle" fill="#713f12" font-size="2.2" font-family="Segoe UI, sans-serif" font-weight="700">напиши мне</text>
                </g>
              </g>
              <!-- typing hands / claws -->
              <g class="avatar__hand avatar__hand--l">
                <rect x="12" y="41" width="7" height="4" fill="#94a3b8"/>
                <rect x="12" y="44" width="2" height="2" fill="#64748b"/>
                <rect x="15" y="44" width="2" height="2" fill="#64748b"/>
              </g>
              <g class="avatar__hand avatar__hand--r">
                <rect x="29" y="41" width="7" height="4" fill="#94a3b8"/>
                <rect x="29" y="44" width="2" height="2" fill="#64748b"/>
                <rect x="32" y="44" width="2" height="2" fill="#64748b"/>
              </g>
            </svg>
          </div>
        </figure>
  </div>
  <script>
  window.I18N = {
    ru: { avatar_sticky: "напиши мне" },
    en: { avatar_sticky: "write to me" }
  };
  </script>
  <script src="avatar.js"></script>
</body>
</html>
